{% load static site_tags %}
<a href="{{ u.get_absolute_url }}" class="ucard" data-reveal data-uf="{{ u.uf }}">
  <div class="ucard__img">
    {% if u.imagem %}<img src="{{ u.imagem.url }}" alt="{{ u.nome }}" loading="lazy">{% else %}<img src="{% static 'img/hero-padrao.jpg' %}" alt="" loading="lazy">{% endif %}
    <span class="ucard__uf">{{ u.uf }}</span>
    {% if u.status == 'implantacao' %}<span class="ucard__badge">Em implantação</span>{% elif u.sede %}<span class="ucard__badge ucard__badge--sede">Sede</span>{% endif %}
  </div>
  <div class="ucard__body">
    <h3>{{ u.nome }}</h3>
    <p>{{ u.resumo|truncatechars:120 }}</p>
    <span class="ucard__more">Ver unidade {% icone "arrow" %}</span>
  </div>
</a>
